name: Build dde-session-shell

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside Deepin container
        run: |
          docker run --rm -v "$PWD":/build -w /build debian:bookworm bash -c '
            set -euxo pipefail
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates gnupg apt-transport-https curl build-essential cmake devscripts equivs git
            echo "deb [trusted=yes] https://community-packages.deepin.com/beige crimson main" > /etc/apt/sources.list.d/deepin.list
            apt-get update
            mk-build-deps -i -t "apt-get -y --no-install-recommends" debian/control
            mkdir -p build && cd build
            cmake ..
            make -j$(nproc)
          '

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dde-session-shell-build
          path: build/
