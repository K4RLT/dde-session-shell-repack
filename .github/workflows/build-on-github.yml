name: Build dde-session-shell

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside Deepin container
        run: |
          docker run --rm -v "$PWD":/build -w /build debian:bookworm bash -c '
            set -euxo pipefail
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates gnupg apt-transport-https curl build-essential cmake dpkg-dev git
            rm -f /etc/apt/sources.list.d/debian.sources
            echo "deb [trusted=yes] https://community-packages.deepin.com/beige crimson main" > /etc/apt/sources.list
            apt-get update
            apt-get build-dep -y .
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release ..
            make -j$(nproc)
            find . -maxdepth 1 -type f -executable -exec strip --strip-unneeded {} \; || true
          '

      - name: Package build output
        run: |
          cd build
          tar -czf ../dde-session-shell-build.tar.gz .

      - name: Create beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Beta build ${{ github.run_number }}
          prerelease: true
          files: dde-session-shell-build.tar.gz
